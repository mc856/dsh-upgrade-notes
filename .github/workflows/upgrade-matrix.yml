name: upgrade-matrix-linux

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GNU time
        run: sudo apt-get update -qq && sudo apt-get install -y -qq time zstd

      - name: Pre-create the workspace paths recorded inside the committed snapshot
        run: |
          tar -xzOf fixtures/snapshots/home-0.1.0-rc.7.tar.gz ./storages/workspace.json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print(w['path']) for w in d['tables']['workspaces'].values()]" \
            | while read -r p; do
                sudo mkdir -p "$p"
                top="/$(echo "$p" | cut -d/ -f2)"
                sudo chown -R "$USER" "$top"
              done

      # First run 2026-08-27 hit the exact community OOM (#3727/#3812 pattern):
      # npm's dependency-tree resolution aborts at the default ~2GB V8 old-space
      # on this 7GB runner (Mark-Compact ~2015MB -> exit 134). Keep that as a
      # recorded reproduction, then install with the community workaround.
      - name: Reproduce community install OOM (default Node heap)
        run: |
          set +e
          mkdir -p logs/linux /tmp/oom-repro
          /usr/bin/time -v npm install --prefix /tmp/oom-repro --no-fund --no-audit \
            "@deepseek-ai/dsh@0.1.0-rc.7" 2>&1 | tee logs/linux/oom-repro-default-heap.log
          code=${PIPESTATUS[0]}
          rm -rf /tmp/oom-repro
          if [ "$code" -ne 0 ]; then
            echo "reproduced: npm exited $code under the default heap" | tee -a logs/linux/oom-repro-default-heap.log
          else
            echo "did not reproduce on this runner" | tee -a logs/linux/oom-repro-default-heap.log
          fi
          exit 0

      - name: Install dsh tags into isolated prefixes (community NODE_OPTIONS workaround)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for v in 0.1.0-rc.7 0.1.0-rc.8 0.1.1-rc.1 0.1.1-rc.2; do
            ./fixtures/install-tag.sh "$v" linux
          done

      - name: Upgrade chain against committed rc.7 fixture home
        run: |
          ./fixtures/upgrade-hop.sh 0.1.0-rc.7        0.1.0-rc.8 4501 linux
          ./fixtures/upgrade-hop.sh chain-0.1.0-rc.8  0.1.1-rc.1 4502 linux
          ./fixtures/upgrade-hop.sh chain-0.1.1-rc.1  0.1.1-rc.2 4503 linux

      - name: Downgrade read test (rc.2 home opened by rc.7)
        run: ./fixtures/upgrade-hop.sh chain-0.1.1-rc.2 0.1.0-rc.7 4504 linux

      - name: Print summaries
        if: always()
        run: cat logs/linux/*.summary.json || true

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-logs
          path: logs/linux/
